  const confirmedParts = written ? (parts || []).filter(p => {
    const terms = written.toLowerCase().split(/[^a-z]+/);

  }) : parts || [];
  for (const p of [...confirmedParts, ...tokens.map(t => ({t:t.replace(/-/g,''),k:t.startsWith('-')?'s':t.endsWith('-')?'p':'r',m:t}))]) {
    if (!p.m) continue;

      const f = alias.trim().toLowerCase();
      return f.replace(/-/g,'') === p.t.toLowerCase() && (f.startsWith('-')?'s':f.endsWith('-')?'p':'r') === p.k;
    })));
    if (found) elementList.add(found);

    ? parts.filter(p => p.t && (p.m || p.t.length > 1)).map(p => '<b>'+escapeHtml(p.t)+'</b>'+(p.m?' ('+escapeHtml(p.m)+')':'')).join(' + ')

function splitLabel(label,limit=27) {
  const lines = [''];
  for (const word of label.split(' ')) {
    const last = lines.length-1;
    if (lines[last].length && lines[last].length + word.length + 1 > limit) lines.push(word);
    else lines[last] += (lines[last] ? ' ' : '') + word;
  }
  return lines;
}

    lines.forEach((line,j) => {

    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Image source and credits';
    box.replaceChildren(img,link);
  };
  img.src = url;
}
async function loadPhoto(box) {
  const {topic,word} = box.dataset;
  if (PHOTOS[word]) return addPhoto(box,...PHOTOS[word]);
  if (!photoRequests.has(topic)) {
    const api = 'https://en.wikipedia.org/w/api.php?origin=*&action=query&format=json&formatversion=2&prop=pageimages&pithumbsize=480&redirects=1&titles='+encodeURIComponent(topic);
    photoRequests.set(topic,fetch(api).then(r=>r.ok?r.json():null).then(j=>j?.query?.pages?.[0]?.thumbnail?.source).catch(()=>null));
  }
  const url = await photoRequests.get(topic);
  if (url && box.isConnected) addPhoto(box,url,wikiLink(topic));
}
const photoObserver = typeof IntersectionObserver === 'function' ? new IntersectionObserver(entries => {
  for (const entry of entries) if (entry.isIntersecting) {
    photoObserver.unobserve(entry.target);
    loadPhoto(entry.target);
  }
},{rootMargin:'160px'}) : null;
if (typeof MutationObserver === 'function') {
  new MutationObserver(() => $.querySelectorAll('.photo-slot:not([data-queued])').forEach(box => {
    box.dataset.queued = 'true';
    if (photoObserver) photoObserver.observe(box);
    else loadPhoto(box);
  })).observe($,{subtree:true,childList:true});
}
function figureHtml(word,figure) {
  const topic = pictureTopics.get(word) || (PHOTOS[word] && word);
  if (!topic && !figure && !Object.hasOwn(plotted,word)) return '';
  return '<figure class="answer-figure">'+
    (topic ? '<div class="photo-slot" data-word="'+escapeHtml(word)+'" data-topic="'+escapeHtml(topic)+'"><a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(PHOTOS[word]?.[1] || wikiLink(topic))+'">View image of '+escapeHtml(topic)+'</a></div>' : '')+
    (figure || Object.hasOwn(plotted,word) ? conceptFigure(word,figure) : '')+'</figure>';
}
function answerDetails(word,origin) {
  const context = subjectExamples.get(word);
  const domain = wordsByDomain.get(word);
  const book = bookSections.get(word) || TEXTBOOKS[domain];
  const lookup = 'https://dictionary.cambridge.org/search/english/?q='+encodeURIComponent(contextLookup[word] || word);
  const cam = '<a href="'+lookup+'" target="_blank" rel="noopener noreferrer">Cambridge Dictionary lookup</a>';
  const sources = (book ? '<a href="'+escapeHtml(book[1])+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(book[0])+'</a> · ' : '')+cam;
  return wordParts(word,origin)+
    (context ? '<div class="detail-block"><div class="detail-label">In context'+(domain==null?'':' · '+escapeHtml(DOM[domain]))+'</div><div>'+escapeHtml(context[0])+'.</div></div>' : '')+
    figureHtml(word,context?.[1])+'<div class="detail-sources">'+sources+'</div>';
}
function wordCard(x,meaning=x.d) {
  return '<div class="answer-word"><b>'+escapeHtml(x.w)+'</b> '+ip(x.w)+'</div>'+
    '<div class="answer-definition">'+escapeHtml(definition(x.w,meaning))+'</div>'+
    (x.e ? '<div class="usage-example">'+escapeHtml(x.e).replace(/\[(.+?)\]/,'<b>$1</b>')+'</div>' : '')+
    answerDetails(x.w,x.et);
}

draw();
